#          path: artifacts/logcat.log
  Lint:
    name: Lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        java_version: [ 17 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          submodules: true
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}
      - uses: gradle/actions/wrapper-validation@v6.3.0
      - name: Install Android SDK
        uses: hannesa2/action-android/install-sdk@0.17.0
      - name: Decrypt keystore
        run: ./signing/decrypt.sh
        env:
          CRYPT_PASS: ${{ secrets.CRYPT_PASS }}
      - name: Lint
        run: ./gradlew lint
      - name: Archive Lint report
        uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: ownCloud-Lint-report
          path: lint-app-report.html
      - name: cleanup keystore
        if: ${{ always() }}
        run: ./signing/cleanup.sh